name: RPA Prime Execution Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite rodar o fluxo manualmente pelo GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-24.04

    steps:
    # 1. Baixa o código do seu repositório
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Configura a versão do Python desejada
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Otimiza futuras execuções salvando o cache do pip

    # 3. Atualiza os pacotes e instala o ODBC da Microsoft e dependências básicas
    - name: Install System Dependencies & MS ODBC
      run: |
        sudo apt-get update
        # Instala o driver ODBC para SQL Server sem duplicação de repositórios
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev wget unzip

    # 4. Instala o Google Chrome
    - name: Install Google Chrome
      run: |
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
        rm google-chrome-stable_current_amd64.deb
        google-chrome --version

    # 5. Instala as dependências do Python (caso você tenha um requirements.txt)
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 6. Executa o script do seu robô RPA
    - name: Run RPA Script
      env:
        # Exemplo de como passar variáveis de ambiente/segredos se necessário
        DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
      run: |
        # Substitua main.py pelo arquivo principal do seu projeto
        python main.py
