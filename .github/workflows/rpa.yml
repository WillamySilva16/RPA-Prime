name: Executar RPA PrimeBuilder

on:
  # Permite rodar o script manualmente pelo botão no GitHub
  workflow_dispatch:

  # Agendamento automático (Cronjob UTC)
  # Exemplo: Roda de segunda a sexta às 08:00 BRT (11:00 UTC)
  schedule:
    - cron: '0 11 * * 1-5'

jobs:
  run-rpa:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do seu repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura a versão do Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala as dependências listadas no seu requirements.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. (Opcional) Reconstruir pasta CHAVES/ ou arquivo .json de credenciais GCP via Secret
      # - name: Criar arquivo de credenciais GCP
      #   run: |
      #     mkdir -p CHAVES
      #     echo "${{ secrets.GCP_CREDENTIALS_JSON }}" > CHAVES/attrprime.json

      # 5. Executa a automação injetando os Secrets como Variáveis de Ambiente
      - name: Rodar RPA
        env:
          # Mapeie aqui suas Secrets para o Python ler via os.getenv()
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # Adicione as outras variáveis necessárias aqui
        run: |
          python main.py
